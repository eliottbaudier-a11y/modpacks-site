<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modpacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  /* ===== intro cinématique (page d'accueil uniquement) ===== */
  html.intro-lock,html.intro-lock body{overflow:hidden;height:100%}
  .intro{position:fixed;inset:0;z-index:200;background:#0a0806;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .7s ease,transform .7s ease}
  .intro[hidden]{display:none}
  .intro.leaving{opacity:0;transform:scale(1.04);pointer-events:none}
  .intro-media,.intro-video{position:absolute;inset:0;width:100%;height:100%}
  .intro-video{object-fit:cover;object-position:center;filter:saturate(0)}
  .intro-overlay{position:absolute;inset:0;
    background:radial-gradient(ellipse 60% 55% at 50% 46%,rgba(4,3,2,.62) 0%,rgba(4,3,2,.32) 55%,rgba(4,3,2,.22) 100%),
      linear-gradient(to top,rgba(4,3,2,.65) 0%,rgba(4,3,2,0) 32%),
      linear-gradient(to bottom,rgba(4,3,2,.35) 0%,rgba(4,3,2,0) 22%)}
  .intro-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:0 24px;max-width:900px}
  .intro-kicker{font-family:var(--mono);font-size:clamp(12px,1.6vw,15px);letter-spacing:.32em;
    text-transform:uppercase;color:rgba(255,255,255,.82);margin:0;
    opacity:0;transform:translateY(14px)}
  .intro-title{font-family:"Press Start 2P",var(--mono);font-weight:400;text-transform:uppercase;color:var(--accent);
    margin:14px 0 0;font-size:clamp(30px,9.5vw,96px);line-height:1.15;letter-spacing:.02em;
    text-shadow:4px 4px 0 rgba(0,0,0,.55);
    opacity:0;transform:translateY(18px) scale(.98)}
  .intro-sub{font-family:var(--body);font-weight:500;color:rgba(255,255,255,.88);
    font-size:clamp(15px,2vw,19px);margin:18px 0 0;
    opacity:0;transform:translateY(14px)}
  .intro-info{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:2;
    display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:0;padding:0 20px;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(255,255,255,.78);
    opacity:0}
  .intro-info span{display:inline-flex;align-items:center;gap:8px}
  .intro-info span::before{content:"";width:6px;height:6px;flex:none;background:var(--accent)}
  .intro-info span:first-child::before{display:none}

  .intro.ready .intro-kicker{animation:introUp .6s cubic-bezier(.2,.7,.2,1) .5s forwards}
  .intro.ready .intro-title{animation:introUp .7s cubic-bezier(.2,.7,.2,1) .78s forwards}
  .intro.ready .intro-sub{animation:introUp .6s cubic-bezier(.2,.7,.2,1) 1.12s forwards}
  .intro.ready .mc-btn{animation:introUp .6s cubic-bezier(.2,.7,.2,1) 1.42s forwards}
  .intro.ready .intro-info{animation:introFade .6s ease 1.7s forwards}
  @keyframes introUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes introFade{from{opacity:0}to{opacity:1}}
  .intro.no-anim .intro-kicker,.intro.no-anim .intro-title,.intro.no-anim .intro-sub,
  .intro.no-anim .mc-btn,.intro.no-anim .intro-info{opacity:1;transform:none;animation:none}

  /* bouton façon interface Minecraft */
  .mc-btn{margin-top:34px;position:relative;font-family:"Press Start 2P",var(--mono);font-size:clamp(11px,1.4vw,14px);
    color:#fff;background:#6b6b6b;border:2px solid #1c1c1c;padding:18px 30px;letter-spacing:.5px;
    cursor:pointer;text-shadow:2px 2px 0 rgba(0,0,0,.55);
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.45);
    transition:filter .15s ease,transform .12s ease,box-shadow .12s ease;
    opacity:0;transform:translateY(14px)}
  .mc-btn:hover{filter:brightness(1.14)}
  .mc-btn:active{transform:translateY(3px);box-shadow:inset -1px -1px 0 rgba(255,255,255,.18),inset 1px 1px 0 rgba(0,0,0,.35)}
  .mc-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

  @media (max-aspect-ratio:1/1){
    .intro-video{object-position:18% center}
  }
  @media (max-width:640px){
    .intro-sub{max-width:32ch}
    .intro-info{gap:10px 14px;font-size:9.5px}
  }
  @media (prefers-reduced-motion:reduce){
    .intro,.intro *{animation:none!important;transition:opacity .3s ease!important}
    .intro-kicker,.intro-title,.intro-sub,.mc-btn,.intro-info{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
<section class="intro" id="intro" role="dialog" aria-modal="true" aria-label="Introduction — Minecraft Survival">
  <div class="intro-media">
    <video class="intro-video" id="introVideo" autoplay muted loop playsinline
      poster="/assets/hero-intro-poster.jpg">
      <source src="/assets/hero-intro.webm" type="video/webm">
      <source src="/assets/hero-intro.mp4" type="video/mp4">
    </video>
  </div>
  <div class="intro-overlay"></div>
  <div class="intro-content">
    <p class="intro-kicker">Minecraft</p>
    <h1 class="intro-title">Survival</h1>
    <p class="intro-sub">Une aventure entre amis</p>
    <button type="button" class="mc-btn" id="introEnter" autofocus>Entrer dans l'aventure</button>
  </div>
  <p class="intro-info" id="introInfo"></p>
</section>

<header class="top"><div class="wrap">
  <a href="/" aria-label="Accueil"><img src="/assets/logo.png" alt="" class="mark" width="34" height="40"></a>
  <a href="/" class="word" id="brand" style="text-decoration:none">Modpacks</a>
  <nav class="nav"></nav>
  <div class="hgroup">
    <span class="meta"><span id="hmeta"></span></span>
    <a href="/login" class="mini" title="Accéder au générateur / à la modération">Connexion</a>
  </div>
</div></header>

<div class="wrap">
  <section class="lib-hero">
    <p class="kicker" id="kicker">Bibliothèque</p>
    <h1 id="lib-title">modpacks.</h1>
    <p class="lede" id="lib-lede"></p>
  </section>

  <div class="seclabel" id="seclabel"></div>
  <section class="packs" id="packs"></section>
</div>

<footer class="wrap" id="foot"></footer>

<script src="/data/modpacks.js"></script>
<script src="/assets/home.js"></script>
<script src="/assets/nav.js"></script>
<script>
(function () {
  var intro = document.getElementById('intro');
  if (!intro) return;
  var enterBtn = document.getElementById('introEnter');
  var video = document.getElementById('introVideo');
  var info = document.getElementById('introInfo');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.documentElement.classList.add('intro-lock');

  var pack = (window.MODPACKS || [])[0];
  var bits = ['Saison 01'];
  if (pack && pack.mcVersion) bits.push('Minecraft ' + pack.mcVersion);
  if (pack && pack.loader) bits.push(pack.loader);
  if (info) info.innerHTML = bits.map(function (b) { return '<span>' + b + '</span>'; }).join('');

  if (reduced) {
    intro.classList.add('no-anim');
  } else {
    requestAnimationFrame(function () { intro.classList.add('ready'); });
  }

  if (video) {
    var p = video.play();
    if (p && p.catch) p.catch(function () { /* autoplay bloqué : le poster reste affiché */ });
  }

  var dismissed = false;
  function dismiss() {
    if (dismissed) return;
    dismissed = true;
    intro.classList.add('leaving');
    document.documentElement.classList.remove('intro-lock');
    setTimeout(function () {
      intro.hidden = true;
      if (video) video.pause();
    }, reduced ? 320 : 720);
  }

  enterBtn.addEventListener('click', dismiss);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !intro.hidden) dismiss();
  });
})();
</script>
</body>
</html>
