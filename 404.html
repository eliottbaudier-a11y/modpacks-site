<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece7da" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18160f" media="(prefers-color-scheme: dark)">
<title>Page introuvable</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .err-wrap{min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;
    padding:60px 24px;text-align:center}
  .err-code{font-family:var(--disp);font-weight:800;color:var(--accent);line-height:.85;
    font-size:clamp(72px,18vw,168px);letter-spacing:-.03em;margin:0}
  .err-title{font-family:var(--disp);font-weight:800;color:var(--ink);text-transform:lowercase;
    margin:8px 0 0;font-size:clamp(22px,4vw,32px);letter-spacing:-.02em}
  .err-text{max-width:46ch;margin:16px auto 0;color:var(--ink-soft);font-size:15.5px;line-height:1.6}
  .err-cta{margin-top:30px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="/" aria-label="Accueil"><img src="/assets/logo.png" alt="" class="mark" width="34" height="40"></a>
  <a href="/" class="word" style="text-decoration:none">Modpacks</a>
  <nav class="nav"></nav>
</div></header>

<div class="wrap">
  <div class="err-wrap reveal">
    <div>
      <p class="err-code">404</p>
      <h1 class="err-title">dimension inconnue.</h1>
      <p class="err-text">Cette page semble s'être perdue dans une autre dimension — un peu comme un joueur qui a oublié de poser un point de repère avant de partir explorer.</p>
      <p class="err-cta"><a class="go" href="/">← Retour aux modpacks</a></p>
    </div>
  </div>
</div>

<footer class="wrap" id="foot">Page introuvable · erreur 404</footer>
<script src="/assets/toast.js"></script>
<script src="/assets/nav.js"></script>
</body>
</html>
